services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build: .
    # concurrency=1: each process holds its own Whisper model in memory
    command: celery -A app.celery_app worker --loglevel=info --concurrency=1
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - models:/models                          # Whisper weights (HF cache)
      - speaker-model:/app/pretrained_models    # SpeechBrain ECAPA weights
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  models:
  speaker-model:

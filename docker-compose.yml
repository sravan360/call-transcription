services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8081
    ports:
      - "8081:8081"
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build: .
    # concurrency=1: each process holds its own Whisper model in memory
    command: celery -A app.celery_app worker --loglevel=info --concurrency=1
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - models:/models                          # Whisper weights (HF cache)
      - speaker-model:/app/pretrained_models    # SpeechBrain ECAPA weights
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - redis
    restart: "no"

  cron:
    image: alpine:3.20
    # Periodically stop the server if the Celery queue is empty (schedule: SHUTDOWN_CRON in .env)
    command: >
      sh -c "apk add --no-cache curl >/dev/null &&
             echo \"$${SHUTDOWN_CRON:-*/30 * * * *} curl -sS -X POST http://api:8081/shutdown-if-idle > /proc/1/fd/1 2>&1; echo >> /proc/1/fd/1\" | crontab - &&
             crond -f -l 8"
    env_file: .env
    depends_on:
      - api
    restart: unless-stopped

volumes:
  models:
  speaker-model:
